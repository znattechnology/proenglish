name: Web Deploy (VPS mambo-labtic)

# Push para main com alterações na web -> lint, testes e build (web-ci.yml) -> imagem no
# GitHub Container Registry -> deploy no servidor (apps/api/deploy/vps/deploy.sh web).
# A web corre no mesmo servidor da API, atrás do Caddy partilhado (substitui a Vercel).
#
# Os endereços públicos ficam dentro da imagem (NEXT_PUBLIC_*). Por agora são os endereços
# sslip.io; quando houver domínio, definir no repositório (Settings > Variables > Actions):
#   WEB_URL   p.ex. https://novodominio.ao
#   API_URL   p.ex. https://api.novodominio.ao
# e fazer um deploy novo (Actions > Web Deploy > Run workflow).
# Secrets: VPS_HOST e VPS_SSH_KEY (os mesmos da API).

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - '.github/workflows/web-deploy.yml'
      - '.github/workflows/web-ci.yml'
  workflow_dispatch:

concurrency:
  group: web-deploy
  cancel-in-progress: false

env:
  IMAGEM: ghcr.io/znattechnology/proenglish-web
  WEB_URL: ${{ vars.WEB_URL || 'https://proenglish.2.31.122.170.sslip.io' }}
  API_URL: ${{ vars.API_URL || 'https://proenglish-api.2.31.122.170.sslip.io' }}

jobs:
  ci:
    name: Lint, testes e build
    uses: ./.github/workflows/web-ci.yml

  imagem:
    name: Imagem
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir e publicar
        uses: docker/build-push-action@v6
        with:
          context: apps/web
          push: true
          build-args: |
            NEXT_PUBLIC_DJANGO_API_URL=${{ env.API_URL }}/api/v1
            NEXT_PUBLIC_API_URL=${{ env.API_URL }}
            NEXT_PUBLIC_FRONTEND_URL=${{ env.WEB_URL }}
          tags: |
            ${{ env.IMAGEM }}:${{ github.sha }}
            ${{ env.IMAGEM }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    name: Deploy
    needs: imagem
    runs-on: ubuntu-latest
    environment: producao
    permissions:
      contents: read
      packages: read
    steps:
      - name: Deploy no servidor
        uses: appleboy/ssh-action@v1.0.3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          GH_REPO: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
          IMAGEM: ${{ env.IMAGEM }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GH_TOKEN,GH_ACTOR,GH_REPO,GH_SHA,IMAGEM
          script_stop: true
          command_timeout: 20m
          script: |
            set -eu
            APP=/opt/proenglish/app
            test -d "$APP/.git" || { echo "ERRO: $APP não existe. Fazer a instalação inicial (README)."; exit 1; }
            cd "$APP"
            # O token só vive nestes comandos: não fica na configuração do git nem do docker.
            git fetch --quiet "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git" "$GH_SHA"
            git reset --hard --quiet FETCH_HEAD
            echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin >/dev/null
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
            "$APP/apps/api/deploy/vps/deploy.sh" web "$IMAGEM:$GH_SHA"

      - name: Verificar de fora (HTTPS pelo Caddy)
        run: |
          for i in $(seq 1 12); do
            if curl -fsS --max-time 15 "$WEB_URL/" >/dev/null; then
              echo "Web a responder em $WEB_URL"; exit 0
            fi
            sleep 5
          done
          echo "::error::A web respondeu no servidor mas não em $WEB_URL (DNS ou Caddy?)"
          exit 1

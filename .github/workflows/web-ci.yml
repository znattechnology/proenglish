name: Web CI (Next.js)

on:
  push:
    branches: [ develop ]
    paths:
      - 'apps/web/**'
      - '.github/workflows/web-ci.yml'
  pull_request:
    branches: [ develop, main ]
    paths:
      - 'apps/web/**'
      - '.github/workflows/web-ci.yml'
  # Chamado pelo web-deploy.yml: a Vercel só recebe código com lint, testes e build a passar.
  workflow_call:

defaults:
  run:
    working-directory: apps/web

jobs:
  ci:
    name: Lint, Test and Build
    runs-on: ubuntu-latest
    env:
      NODE_VERSION: '20'
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm test --silent

      - name: Build (Next.js)
        run: npm run build

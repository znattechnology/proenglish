name: API Deploy (VPS mambo-labtic)

# Publica a API em /opt/proenglish no servidor partilhado com o LabTIC e O Mambo.
# Só mexe no projecto compose "proenglish": nunca toca no Caddy nem nos outros projectos.
#
# Secrets necessários:
#   VPS_HOST      2.31.122.170
#   VPS_SSH_KEY   chave privada cuja pública está em ~deploy/.ssh/authorized_keys
#
# O primeiro arranque faz-se à mão (ver apps/api/deploy/vps/README.md); este workflow
# só actualiza uma instalação que já existe.

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - '.github/workflows/api-deploy.yml'
  workflow_dispatch:

concurrency:
  group: api-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GH_TOKEN,GH_REPO,GH_SHA
          script_stop: true
          command_timeout: 30m
          script: |
            set -eu
            APP=/opt/proenglish/app
            VPS="$APP/apps/api/deploy/vps"

            test -d "$APP/.git" || { echo "ERRO: $APP não existe. Fazer a instalação inicial (README)."; exit 1; }
            test -f "$VPS/.env" || { echo "ERRO: falta $VPS/.env"; exit 1; }

            echo "== Código ($GH_SHA)"
            cd "$APP"
            # O token só vive neste comando: não fica guardado na configuração do git.
            git fetch --quiet "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git" "$GH_SHA"
            git reset --hard --quiet FETCH_HEAD

            echo "== Imagem"
            cd "$VPS"
            docker compose build api

            echo "== Base de dados e migrações"
            docker compose up -d postgres
            docker compose run --rm api python manage.py migrate --noinput

            echo "== API"
            docker compose up -d api

            echo "== Saúde"
            ok=0
            for i in $(seq 1 24); do
              estado=$(docker inspect -f '{{.State.Health.Status}}' proenglish-api-1 2>/dev/null || echo "?")
              if [ "$estado" = "healthy" ]; then ok=1; break; fi
              sleep 5
            done
            docker compose ps
            if [ "$ok" != "1" ]; then
              echo "ERRO: a API não ficou saudável"
              docker compose logs --tail=80 api
              exit 1
            fi

            # Só as imagens antigas deste projecto que ficaram sem etiqueta.
            docker image prune -f --filter "label=com.docker.compose.project=proenglish" >/dev/null || true
            echo "== Deploy concluído"

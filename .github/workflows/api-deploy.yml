name: API Deploy (VPS mambo-labtic)

# Push para main com alterações na API -> testes -> imagem no GitHub Container Registry ->
# deploy no servidor partilhado (apps/api/deploy/vps/deploy.sh). Sem passos à mão.
#
# O servidor não compila nada: descarrega a imagem já testada. Se a API nova não ficar
# saudável, o deploy.sh volta à imagem anterior e o workflow falha.
# Nunca toca no Caddy nem nos outros projectos do servidor.
#
# Secrets (Settings > Secrets and variables > Actions):
#   VPS_HOST      2.31.122.170
#   VPS_SSH_KEY   chave privada cuja pública está em ~deploy/.ssh/authorized_keys
# Ambiente "producao" (Settings > Environments): opcional, para pedir aprovação antes do deploy.
#
# A instalação inicial (base, .env, Caddy, dados do Neon) faz-se uma vez à mão:
# ver apps/api/deploy/vps/README.md.

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - '.github/workflows/api-deploy.yml'
      - '.github/workflows/api-tests.yml'
  workflow_dispatch:

concurrency:
  group: api-deploy
  cancel-in-progress: false

env:
  IMAGEM: ghcr.io/znattechnology/proenglish-api

jobs:
  testes:
    name: Testes
    uses: ./.github/workflows/api-tests.yml
    permissions:
      contents: read
      pull-requests: write
      checks: write

  imagem:
    name: Imagem
    needs: testes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir e publicar
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          push: true
          tags: |
            ${{ env.IMAGEM }}:${{ github.sha }}
            ${{ env.IMAGEM }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy
    needs: imagem
    runs-on: ubuntu-latest
    environment: producao
    permissions:
      contents: read
      packages: read
    steps:
      - name: Deploy no servidor
        uses: appleboy/ssh-action@v1.0.3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          GH_REPO: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
          IMAGEM: ${{ env.IMAGEM }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GH_TOKEN,GH_ACTOR,GH_REPO,GH_SHA,IMAGEM
          script_stop: true
          command_timeout: 20m
          script: |
            set -eu
            APP=/opt/proenglish/app
            test -d "$APP/.git" || { echo "ERRO: $APP não existe. Fazer a instalação inicial (README)."; exit 1; }

            echo "== Código ($GH_SHA): docker-compose.yml e scripts"
            cd "$APP"
            # O token só vive nestes comandos: não fica na configuração do git nem do docker.
            git fetch --quiet "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git" "$GH_SHA"
            git reset --hard --quiet FETCH_HEAD

            echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin >/dev/null
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
            "$APP/apps/api/deploy/vps/deploy.sh" "$IMAGEM:$GH_SHA"

      - name: Verificar de fora (HTTPS pelo Caddy)
        env:
          # Variável do repositório API_URL (Settings > Variables) quando houver domínio.
          API_URL: ${{ vars.API_URL || 'https://proenglish-api.2.31.122.170.sslip.io' }}
        run: |
          for i in $(seq 1 12); do
            if curl -fsS --max-time 10 "$API_URL/api/health/" >/dev/null; then
              echo "API saudável em $API_URL"; exit 0
            fi
            sleep 5
          done
          echo "::error::A API respondeu no servidor mas não em $API_URL (DNS ou Caddy?)"
          exit 1

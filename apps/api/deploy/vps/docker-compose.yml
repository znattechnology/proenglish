# ProEnglish API — servidor mambo-labtic (2.31.122.170), em /opt/proenglish/app/apps/api/deploy/vps.
# Base de dados própria (sem Neon) e API isoladas numa rede interna; só a API entra
# na rede do Caddy (publica), com o nome proenglish-api. Nada publica portas no servidor.
#
# Os deploys são automáticos (GitHub Actions -> deploy.sh): a imagem vem pronta do GitHub
# Container Registry (ghcr.io), já testada; o servidor não compila nada.
#
#   ./deploy.sh ghcr.io/znattechnology/proenglish-api:<sha>   o que o workflow corre
#   docker compose ps / logs -f api                            ver o estado
#   docker compose exec api python manage.py <comando>         comando na API em execução
#   docker compose build api && API_IMAGE=proenglish/api:local docker compose up -d api
#                                                              recurso: compilar no servidor
#
# Os limites de memória contam: o servidor (4 GB) é partilhado com o LabTIC e O Mambo.
name: proenglish

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  postgres:
    image: postgres:18-alpine
    restart: always
    logging: *logging
    environment:
      POSTGRES_DB: proenglish
      POSTGRES_USER: proenglish
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - max_connections=40
      - -c
      - work_mem=4MB
      - -c
      - timezone=UTC
    volumes:
      # Postgres 18: o volume monta em /var/lib/postgresql (não em .../data).
      - pgdata:/var/lib/postgresql
    networks: [interna]
    mem_limit: 256m
    memswap_limit: 512m
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "proenglish", "-d", "proenglish"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../..
    # A imagem em uso fica em ./imagem-actual (deploy.sh escreve-a e exporta API_IMAGE).
    image: ${API_IMAGE:-ghcr.io/znattechnology/proenglish-api:latest}
    restart: always
    logging: *logging
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DEBUG: "False"
      DJANGO_SETTINGS_MODULE: core.settings
      # Sempre a base local; sobrepõe-se a qualquer DATABASE_URL que venha no .env.
      DATABASE_URL: postgresql://proenglish:${POSTGRES_PASSWORD}@postgres:5432/proenglish
    # 2 workers x 2 threads: cabe nos 512 MB. O Dockerfile traz 3 por omissão.
    command:
      - gunicorn
      - core.wsgi:application
      - --bind=0.0.0.0:8000
      - --workers=2
      - --worker-class=gthread
      - --threads=2
      - --timeout=120
      - --max-requests=1000
      - --max-requests-jitter=100
      - --access-logfile=-
      - --error-logfile=-
    volumes:
      - media:/app/media
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8000/api/health/"]
      interval: 15s
      timeout: 10s
      start_period: 40s
      retries: 3
    networks:
      interna:
      publica:
        aliases: [proenglish-api]
    mem_limit: 512m
    memswap_limit: 768m

  # Web (Next.js). Imagem construída no GitHub com os endereços públicos já dentro
  # (ver .github/workflows/web-deploy.yml); a imagem em uso fica em WEB_IMAGE no .env.
  web:
    image: ${WEB_IMAGE:-ghcr.io/znattechnology/proenglish-web:latest}
    restart: always
    logging: *logging
    environment:
      NODE_ENV: production
      # Pedidos do servidor da web à API pela rede do Caddy, sem sair para a Internet.
      DJANGO_API_URL_INTERNA: http://proenglish-api:8000/api/v1
      DJANGO_API_URL: http://proenglish-api:8000/api/v1
    networks:
      publica:
        aliases: [proenglish-web]
    mem_limit: 384m
    memswap_limit: 512m

volumes:
  pgdata:
  media:

networks:
  # Sem saída para fora: a base não fica à vista dos outros projectos nem da Internet.
  interna:
    internal: true
  # Rede do Caddy (/opt/proxy). Dá também à API saída para OpenAI, S3, email e Vapi.
  publica:
    external: true

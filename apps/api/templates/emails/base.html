<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block titulo %}ProEnglish{% endblock %}</title>
</head>
<body style="margin:0;padding:0;background:#f4f6f8;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;color:#1f2937;line-height:1.6;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f6f8;padding:24px 12px;">
<tr><td align="center">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border-radius:12px;overflow:hidden;border:1px solid #e5e7eb;">
<tr><td style="background:#1d4ed8;padding:24px 28px;color:#ffffff;">
<div style="font-size:22px;font-weight:700;letter-spacing:0.5px;">ProEnglish</div>
<div style="font-size:14px;opacity:0.9;">Inglês para profissionais</div>
</td></tr>
<tr><td style="padding:28px;">
{% if user_name %}<p style="margin:0 0 16px;font-size:16px;">Olá, {{ user_name }}.</p>{% else %}<p style="margin:0 0 16px;font-size:16px;">Olá.</p>{% endif %}
{% block conteudo %}{% endblock %}
</td></tr>
<tr><td style="padding:20px 28px;background:#f9fafb;border-top:1px solid #e5e7eb;font-size:12px;color:#6b7280;">
<p style="margin:0 0 6px;">Precisa de ajuda? Escreva-nos para <a href="mailto:{{ support_email }}" style="color:#1d4ed8;">{{ support_email }}</a>.</p>
<p style="margin:0;">© {{ current_year }} ProEnglish. Este email foi enviado para {{ user_email }}.</p>
</td></tr>
</table>
</td></tr>
</table>
</body>
</html>

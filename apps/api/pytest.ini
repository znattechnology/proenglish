# Configuração do pytest (pytest-django), usada pelos alvos do Makefile.
# O comando de referência continua a ser `python manage.py test --settings=core.test_settings`;
# o pytest corre o mesmo conjunto (os testes dentro de apps/).
[pytest]
DJANGO_SETTINGS_MODULE = core.test_settings
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*
addopts =
    --tb=short
    --disable-warnings
    -ra
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    unit: unit tests
    integration: integration tests
    security: security tests
    performance: performance tests
    critical: critical business logic tests
    api: API endpoint tests
    auth: authentication tests
    payments: payment related tests
testpaths = apps
filterwarnings =
    ignore::django.utils.deprecation.RemovedInDjango50Warning
    ignore::DeprecationWarning
